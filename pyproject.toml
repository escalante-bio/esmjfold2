[project]
name = "esmjfold2"
version = "0.1.0"
description = "JAX/Equinox translation of ESMFold2"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.0",
    "equinox>=0.12.1",
    "jax>=0.10.0",
    "jaxtyping>=0.3.2",
    "numpy>=1.26.3",
    "torch",
    "accelerate",
    "safetensors",
    # Native Torch models and checkpoint-layout translation from Biohub.
    "esm==3.4.1.post1",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.10.0"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/esmjfold2"]

[tool.hatch.metadata]
allow-direct-references = true
